
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>Contato - Smart Way</title>
</head>

<body>
    <header class="site-header">

        <h1>SMART WAY</h1>

        <nav>
            <a href="../../index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <main class="contato">

        <!-- formulario -->
        <form class="formulario" action="#" method="post">

            <h2>Fale com a gente</h2>

            <p>Envie suas dúvidas, sugestões ou reclamações.</p>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome"
                    placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                    placeholder="Digite seu e-mail" required>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem"
                    placeholder="Escreva sua mensagem"></textarea>
            </div>

            <div class="botoes">
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </div>

        </form>

<!-- slider de acessibilidade -->
<section class="acessibilidade">

    <h2>Acessibilidade</h2>

    <p>
        Selecione seu perfil para encontrar
        informações relevantes.
    </p>

    <div class="campo">

        <label for="perfil">
            Perfil de acessibilidade
        </label>

        <select id="perfil" name="perfil">

            <option value="" selected disabled>
                Selecione uma opção
            </option>

            <option value="nenhuma">
                Não tenho necessidade específica
            </option>

            <option value="visual">
                Deficiência visual
            </option>

            <option value="auditiva">
                Deficiência auditiva
            </option>

            <option value="tea">
                TEA
            </option>

            <option value="mobilidade">
                Mobilidade reduzida
            </option>

            <option value="outra">
                Outra necessidade
            </option>

        </select>

    </div>

</section>

    </main>

    <footer>
        <p>Smart Way © 2026</p>
    </footer>

</body>
</html>
